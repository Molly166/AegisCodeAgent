# Staged migration: activate only after the v1 reviewer contract is in trusted Base.
name: Aegis Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      provider:
        description: 'none, deepseek, openai-compatible, or orcarouter'
        type: string
        default: deepseek
      model:
        description: 'A fixed model identifier; empty uses the provider preset'
        type: string
        default: ''
      base-url:
        description: 'Optional HTTPS endpoint, configured by the workflow owner'
        type: string
        default: ''
      allow-custom-endpoint:
        description: 'Explicitly permit sending code and the key to a custom endpoint'
        type: boolean
        default: false
      fail-on:
        type: string
        default: p1
      fail-on-needs-review:
        type: string
        default: p0
      fail-on-incomplete:
        type: boolean
        default: true
      require-agent:
        description: 'Block unless the Reasoning Agent completes; also blocks static-only fork reviews'
        type: boolean
        default: false
    secrets:
      provider-api-key:
        description: 'Optional provider key; never passed to fork PRs or analysis containers'
        required: false
      DEEPSEEK_API_KEY:
        description: 'Legacy DeepSeek-only key for Aegis self-review; external callers should use provider-api-key'
        required: false

permissions: {}

concurrency:
  group: aegis-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve trusted reviewer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      reviewer-sha: ${{ steps.identity.outputs.reviewer-sha }}
      base: ${{ steps.identity.outputs.base }}
      head: ${{ steps.identity.outputs.head }}
      number: ${{ steps.identity.outputs.number }}
      same-repository: ${{ steps.identity.outputs.same-repository }}
      compatible: ${{ steps.contract.outputs.compatible }}
    steps:
      # github.repository/workflow_sha refer to the CALLER in a reusable
      # workflow. Resolve the CALLED workflow's SHA from GitHub's run metadata.
      # No PR checkout, secrets, OIDC token, or caller-supplied source ref here.
      - name: Resolve immutable workflow identity and PR commits
        id: identity
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            if (context.eventName !== 'pull_request' || !pr) {
              throw new Error('Aegis requires a pull_request event; pull_request_target is not supported.');
            }
            const source = 'Molly166/AegisCodeAgent';
            const workflow = source + '/.github/workflows/aegis-review.yml@';
            const { data: run } = await github.request(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}', {
                ...context.repo, run_id: context.runId,
                attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
              });
            const refs = (run.referenced_workflows || []).filter(ref => ref.path.startsWith(workflow));
            let reviewerSHA;
            if (refs.length === 1) {
              reviewerSHA = refs[0].sha;
            } else if (refs.length === 0 && context.repo.owner + '/' + context.repo.repo === source &&
                       run.path.split('@')[0] === '.github/workflows/aegis-review.yml') {
              reviewerSHA = pr.base.sha; // Aegis self-review always uses trusted Base.
            } else {
              throw new Error('Cannot unambiguously identify the called Aegis workflow. Pin one Aegis call per run.');
            }
            for (const sha of [reviewerSHA, pr.base.sha, pr.head.sha]) {
              if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Expected an immutable Git commit SHA.');
            }
            if (pr.base.repo.full_name !== context.repo.owner + '/' + context.repo.repo) {
              throw new Error('PR base repository does not match the workflow repository.');
            }
            core.setOutput('reviewer-sha', reviewerSHA);
            core.setOutput('base', pr.base.sha);
            core.setOutput('head', pr.head.sha);
            core.setOutput('number', String(pr.number));
            core.setOutput('same-repository', pr.head.repo.full_name === pr.base.repo.full_name);

      - name: Inspect trusted source without running PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Molly166/AegisCodeAgent
          ref: ${{ steps.identity.outputs.reviewer-sha }}
          path: reviewer
          persist-credentials: false

      - name: Check trusted reviewer protocol before analysis
        id: contract
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            // Keep this preflight inline: old Base may not contain any v1 scripts.
            const fs = require('node:fs');
            const path = require('node:path');
            const root = path.join(process.env.GITHUB_WORKSPACE, 'reviewer');
            const required = ['scripts/reviewer-contract.json', 'scripts/analysis.Dockerfile',
              'scripts/prepare-analysis-cache.sh', 'scripts/run-ci-review.sh',
              'scripts/publish-report.cjs', 'scripts/pr-comment.cjs'];
            let compatible = false;
            try {
              if (!fs.lstatSync(path.join(root, 'scripts')).isDirectory() ||
                  !required.every(file => fs.lstatSync(path.join(root, file)).isFile())) {
                throw new Error('Missing regular trusted protocol files');
              }
              const contract = path.join(root, required[0]);
              if (fs.statSync(contract).size > 4096) throw new Error('Oversized protocol manifest');
              compatible = JSON.parse(fs.readFileSync(contract, 'utf8')).workflow_protocol === 1;
            } catch { /* Missing or incompatible trusted Base is not a clean review. */ }
            core.setOutput('compatible', String(compatible));
            if (!compatible) {
              core.warning('Trusted reviewer is incompatible with workflow protocol v1. Complete the two-stage Base migration before activation; PR Head will not be used as a fallback.');
            }

  analyze:
    name: Sandboxed analysis
    needs: prepare
    if: ${{ needs.prepare.outputs.compatible == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      exit-code: ${{ steps.review.outputs.exit-code }}
    steps:
      - name: Check out trusted Aegis source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Molly166/AegisCodeAgent
          ref: ${{ needs.prepare.outputs.reviewer-sha }}
          path: reviewer
          persist-credentials: false

      - name: Check out target repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Select exact PR Head
        env:
          AEGIS_HEAD: ${{ needs.prepare.outputs.head }}
          AEGIS_BASE: ${{ needs.prepare.outputs.base }}
        run: |
          git -C target -c core.hooksPath=/dev/null checkout --detach "$AEGIS_HEAD"
          git -C target cat-file -e "$AEGIS_BASE^{commit}"
          test "$(git -C target rev-parse HEAD)" = "$AEGIS_HEAD"
          test -z "$(git -C target status --porcelain=v1 --untracked-files=all)"

      - name: Set up trusted Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Build reviewer and sandbox from trusted source
        working-directory: reviewer
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin" "$GITHUB_WORKSPACE/evidence"
          go build -trimpath -o "$GITHUB_WORKSPACE/bin/aegis" ./cmd/aegis
          "$GITHUB_WORKSPACE/bin/aegis" review --help > "$RUNNER_TEMP/aegis-review-help" 2>&1
          grep -q -- '-sandbox' "$RUNNER_TEMP/aegis-review-help"
          "$GITHUB_WORKSPACE/bin/aegis" github --help > "$RUNNER_TEMP/aegis-github-help" 2>&1
          grep -q -- '-expected-head' "$RUNNER_TEMP/aegis-github-help"
          docker build --tag aegis-analysis:local --file scripts/analysis.Dockerfile scripts

      # Only downloads dependencies; never runs target tests. No model secret,
      # host home, Docker socket, GitHub control file or git credential is mounted.
      - name: Prepare isolated dependency cache without secrets
        run: bash reviewer/scripts/prepare-analysis-cache.sh "$GITHUB_WORKSPACE/target" "$RUNNER_TEMP/aegis-modcache"

      - name: Review exact PR Head
        id: review
        env:
          AEGIS_BASE: ${{ needs.prepare.outputs.base }}
          AEGIS_HEAD: ${{ needs.prepare.outputs.head }}
          AEGIS_PROVIDER: ${{ inputs.provider || 'deepseek' }}
          AEGIS_MODEL: ${{ inputs.model }}
          AEGIS_BASE_URL: ${{ inputs.base-url }}
          AEGIS_ALLOW_CUSTOM_ENDPOINT: ${{ inputs.allow-custom-endpoint || false }}
          AEGIS_PROVIDER_API_KEY: ${{ needs.prepare.outputs.same-repository == 'true' && github.actor != 'dependabot[bot]' && (secrets.provider-api-key || ((inputs.provider == '' || inputs.provider == 'deepseek') && secrets.DEEPSEEK_API_KEY)) || '' }}
        run: bash reviewer/scripts/run-ci-review.sh

      - name: Preserve JSON evidence even on a blocked or incomplete review
        if: ${{ always() && hashFiles('evidence/review.json') != '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: aegis-review-evidence-${{ github.run_attempt }}
          path: evidence/review.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Evidence report and PR feedback
    needs: [prepare, analyze]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      exit-code: ${{ steps.fallback.outputs.exit-code || steps.gate.outputs.exit-code }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      AEGIS_BASE: ${{ needs.prepare.outputs.base }}
      AEGIS_HEAD: ${{ needs.prepare.outputs.head }}
      AEGIS_FAIL_ON: ${{ inputs.fail-on || 'p1' }}
      AEGIS_FAIL_ON_NEEDS_REVIEW: ${{ inputs.fail-on-needs-review || 'p0' }}
      # toJSON preserves an explicit false supplied by a reusable caller.
      AEGIS_FAIL_ON_INCOMPLETE: ${{ inputs.provider != '' && toJSON(inputs.fail-on-incomplete) || 'true' }}
      AEGIS_ARTIFACT_NAME: aegis-review-report-${{ github.run_attempt }}
      AEGIS_REQUIRE_AGENT: ${{ inputs.require-agent || false }}
      AEGIS_COMPATIBLE: ${{ needs.prepare.outputs.compatible }}
      AEGIS_REVIEWER_SHA: ${{ needs.prepare.outputs.reviewer-sha }}
    steps:
      - name: Check out trusted publisher on a fresh runner
        if: ${{ needs.prepare.outputs.compatible == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Molly166/AegisCodeAgent
          ref: ${{ needs.prepare.outputs.reviewer-sha }}
          path: reviewer
          persist-credentials: false

      - name: Set up trusted Go toolchain
        if: ${{ needs.prepare.outputs.compatible == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Build trusted publisher
        if: ${{ needs.prepare.outputs.compatible == 'true' }}
        working-directory: reviewer
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin" "$GITHUB_WORKSPACE/artifacts"
          go build -trimpath -o "$GITHUB_WORKSPACE/bin/aegis" ./cmd/aegis

      - name: Download JSON evidence from this run attempt
        if: ${{ needs.prepare.outputs.compatible == 'true' }}
        id: evidence
        continue-on-error: true
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: aegis-review-evidence-${{ github.run_attempt }}
          path: evidence

      - name: Validate evidence and independently compute merge gate
        id: gate
        if: ${{ needs.prepare.outputs.compatible == 'true' && success() }}
        env:
          AEGIS_ANALYSIS_RESULT: ${{ needs.analyze.result }}
          AEGIS_ANALYSIS_EXIT: ${{ needs.analyze.outputs.exit-code }}
        run: node reviewer/scripts/publish-report.cjs

      - name: Preserve blocking diagnostics when the trusted publisher cannot run
        id: fallback
        if: ${{ always() && steps.gate.outcome != 'success' }}
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            // This must not require scripts from missing/incompatible Base or PR Head.
            const fs = require('node:fs');
            const path = require('node:path');
            const sha = value => /^[0-9a-f]{40}$/.test(value || '') ? value : 'unavailable';
            const base = sha(process.env.AEGIS_BASE), head = sha(process.env.AEGIS_HEAD);
            const reviewer = sha(process.env.AEGIS_REVIEWER_SHA);
            const reason = process.env.AEGIS_COMPATIBLE !== 'true'
              ? 'Trusted Base does not support workflow protocol v1. Analysis was not started. Merge the reviewed bootstrap code first, then activate the v1 workflow in a separate PR.'
              : 'Trusted publisher setup or execution failed. No complete review conclusion is available. Inspect the failed workflow step and rerun after repair.';
            const summary = '# 🛡️ Aegis Code Review\n\n❌ **Review incomplete — merge gate blocked.**\n\n' +
              reason + '\n\nThis is an infrastructure failure, not a clean review or a P0/P1 finding.\n\n' +
              'Base: ' + base + '\n\nHead: ' + head + '\n\nTrusted reviewer: ' + reviewer + '\n';
            const output = path.join(process.env.GITHUB_WORKSPACE, 'artifacts');
            fs.mkdirSync(output, { recursive: true });
            fs.writeFileSync(path.join(output, 'review-summary.md'), summary);
            fs.writeFileSync(path.join(output, 'review.html'), '<!doctype html><html lang="en"><meta charset="utf-8">' +
              '<meta name="viewport" content="width=device-width,initial-scale=1"><title>Aegis — review incomplete</title>' +
              '<body><main><h1>Review incomplete — merge gate blocked</h1><p>' + reason +
              '</p><p>No clean review conclusion is available. This is not a P0/P1 finding.</p><dl><dt>Base</dt><dd>' +
              base + '</dd><dt>Head</dt><dd>' + head + '</dd><dt>Trusted reviewer</dt><dd>' + reviewer +
              '</dd></dl></main></body></html>');
            fs.writeFileSync(path.join(output, 'publication.json'), JSON.stringify({
              schema_version: 1, base, head, report_valid: false, exit_code: 1,
            }, null, 2) + '\n');
            await core.summary.addRaw(summary).write();
            core.setOutput('exit-code', '1');

      - name: Upload complete evidence report
        id: report
        if: ${{ always() && hashFiles('artifacts/**') != '' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.AEGIS_ARTIFACT_NAME }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Refresh bot-owned PR feedback only for the current Head
        if: ${{ always() && needs.prepare.outputs.same-repository == 'true' && github.actor != 'dependabot[bot]' && steps.report.outcome == 'success' }}
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          AEGIS_ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
          AEGIS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            // Inline so missing Base scripts cannot prevent diagnostic feedback.
            const fs = require('node:fs');
            const number = context.payload.pull_request.number;
            const matches = pr => pr.state === 'open' && pr.base.sha === process.env.AEGIS_BASE &&
              pr.head.sha === process.env.AEGIS_HEAD;
            const getPR = async () => (await github.rest.pulls.get({ ...context.repo, pull_number: number })).data;
            if (!matches(await getPR())) return;
            const links = [['Download HTML evidence', process.env.AEGIS_ARTIFACT_URL],
              ['Workflow run', process.env.AEGIS_RUN_URL]].map(([label, value]) => {
                const url = new URL(value);
                if (url.origin !== process.env.GITHUB_SERVER_URL) throw new Error('Untrusted report link');
                return '[' + label + '](' + url.href + ')';
              });
            const marker = '<!-- aegis-code-agent-review -->';
            const summary = fs.readFileSync(process.env.GITHUB_WORKSPACE + '/artifacts/review-summary.md', 'utf8');
            const body = [marker, summary.slice(0, 56000).trim(), '', '---', links.join(' · '), '',
              'Reviewed commit: ' + process.env.AEGIS_HEAD].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo,
              issue_number: number, per_page: 100 });
            const previous = comments.find(comment => comment.user?.login === 'github-actions[bot]' &&
              comment.user?.type === 'Bot' && comment.body?.startsWith(marker));
            if (!matches(await getPR())) return;
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: number, body });
            }

  gate:
    name: Aegis merge gate
    needs: [prepare, analyze, publish]
    # A skipped required check may be treated as success by GitHub. Always run
    # this job, including when source resolution or the publisher failed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Enforce review and delivery status after feedback is preserved
        env:
          AEGIS_PREPARE: ${{ needs.prepare.result }}
          AEGIS_ANALYZE: ${{ needs.analyze.result }}
          AEGIS_PUBLISH: ${{ needs.publish.result }}
          AEGIS_GATE: ${{ needs.publish.outputs.exit-code }}
        run: |
          test "$AEGIS_PREPARE" = 'success'
          test "$AEGIS_ANALYZE" = 'success'
          test "$AEGIS_PUBLISH" = 'success'
          test "$AEGIS_GATE" = '0'
