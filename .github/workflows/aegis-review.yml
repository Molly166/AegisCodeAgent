name: Aegis Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: aegis-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Aegis Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AEGIS_ARTIFACT_NAME: aegis-review-report
      AEGIS_FAIL_ON: p1

    steps:
      # Build the reviewer from the trusted PR base, never from code that is
      # proposing changes to Aegis itself.
      - name: Check out trusted reviewer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: reviewer
          fetch-depth: 1
          persist-credentials: false

      # The default pull_request checkout fetches GitHub's merge ref, which
      # contains both base and head commits. The next step moves the worktree to
      # the exact head so Aegis can enforce its evidence-integrity guard.
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Select exact pull-request head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git -C target checkout --detach "$HEAD_SHA"
          git -C target cat-file -e "$BASE_SHA^{commit}"
          test -z "$(git -C target status --porcelain=v1 --untracked-files=all)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: reviewer/go.mod
          cache-dependency-path: reviewer/go.mod
          cache: true

      - name: Build trusted Aegis reviewer
        working-directory: reviewer
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin" "$GITHUB_WORKSPACE/artifacts"
          go build -trimpath -o "$GITHUB_WORKSPACE/bin/aegis" ./cmd/aegis

      # This fallback is used only by the pull request that first introduces
      # the GitHub publisher. Review analysis still runs with the base binary,
      # and reasoning secrets stay disabled until the hardened v0.6 reviewer
      # has landed on the base branch.
      - name: Select trusted publisher
        id: toolchain
        shell: bash
        run: |
          if "$GITHUB_WORKSPACE/bin/aegis" github --help >/dev/null 2>&1; then
            echo "publisher=$GITHUB_WORKSPACE/bin/aegis" >> "$GITHUB_OUTPUT"
            echo "secure_reasoning=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Aegis bootstrap mode::The base branch predates the GitHub publisher. This run is static-only and uses the proposed publisher solely to render existing JSON evidence."
            (
              cd target
              go build -trimpath -o "$GITHUB_WORKSPACE/bin/aegis-publisher" ./cmd/aegis
            )
            echo "publisher=$GITHUB_WORKSPACE/bin/aegis-publisher" >> "$GITHUB_OUTPUT"
            echo "secure_reasoning=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Review pull-request changes
        id: review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          SECURE_REASONING: ${{ steps.toolchain.outputs.secure_reasoning }}
          # Never expose a secret to the bootstrap reviewer or a fork. The
          # trusted base binary must first prove that it supports child-process
          # credential isolation.
          DEEPSEEK_API_KEY: ${{ steps.toolchain.outputs.secure_reasoning == 'true' && github.event.pull_request.head.repo.full_name == github.repository && secrets.DEEPSEEK_API_KEY || '' }}
        shell: bash
        run: |
          set -u
          agent_args=(--agent-provider none)
          reasoning_enabled=false
          if [[ "$SECURE_REASONING" == "true" && "$SAME_REPOSITORY" == "true" && -n "${DEEPSEEK_API_KEY:-}" ]]; then
            agent_args=(--agent-provider deepseek)
            reasoning_enabled=true
            echo "::notice title=Aegis review mode::DeepSeek reasoning and deterministic verification are enabled."
          elif [[ "$SAME_REPOSITORY" != "true" ]]; then
            echo "::notice title=Aegis review mode::Fork pull request: running deterministic static review without repository secrets."
          else
            echo "::notice title=Aegis review mode::DEEPSEEK_API_KEY is not configured: running deterministic static review."
          fi

          set +e
          "$GITHUB_WORKSPACE/bin/aegis" review \
            --repo "$GITHUB_WORKSPACE/target" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --format json \
            --output "$GITHUB_WORKSPACE/artifacts/review.json" \
            "${agent_args[@]}"
          review_exit=$?
          set -e

          echo "exit_code=$review_exit" >> "$GITHUB_OUTPUT"
          echo "reasoning_enabled=$reasoning_enabled" >> "$GITHUB_OUTPUT"
          if [[ "$review_exit" -ne 0 ]]; then
            echo "::warning title=Aegis review incomplete::The review engine returned exit code $review_exit; the publisher will preserve diagnostics and fail the merge gate."
          fi

      - name: Publish summary, annotations, and merge gate
        run: |
          "${{ steps.toolchain.outputs.publisher }}" github \
            --report "$GITHUB_WORKSPACE/artifacts/review.json" \
            --html-output "$GITHUB_WORKSPACE/artifacts/review.html" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --artifact-name "$AEGIS_ARTIFACT_NAME" \
            --fail-on "$AEGIS_FAIL_ON" \
            --fail-on-incomplete=true \
            --max-annotations 50

      - name: Upload complete Aegis evidence report
        if: always() && hashFiles('artifacts/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AEGIS_ARTIFACT_NAME }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
