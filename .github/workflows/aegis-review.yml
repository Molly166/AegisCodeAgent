name: Aegis Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: aegis-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Aegis Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AEGIS_ARTIFACT_NAME: aegis-review-report
      AEGIS_FAIL_ON: p1
      AEGIS_FAIL_ON_NEEDS_REVIEW: p0

    steps:
      # Build the reviewer from the trusted PR base, never from code that is
      # proposing changes to Aegis itself.
      - name: Check out trusted reviewer
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: reviewer
          fetch-depth: 1
          persist-credentials: false

      # The default pull_request checkout fetches GitHub's merge ref, which
      # contains both base and head commits. The next step moves the worktree to
      # the exact head so Aegis can enforce its evidence-integrity guard.
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Select exact pull-request head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git -C target checkout --detach "$HEAD_SHA"
          git -C target cat-file -e "$BASE_SHA^{commit}"
          test -z "$(git -C target status --porcelain=v1 --untracked-files=all)"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: reviewer/go.mod
          cache: true

      - name: Install pinned static analyzers
        env:
          GOBIN: ${{ github.workspace }}/bin/analyzers
        run: |
          mkdir -p "$GOBIN"
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Build trusted Aegis reviewer
        working-directory: reviewer
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin" "$GITHUB_WORKSPACE/artifacts"
          go build -trimpath -o "$GITHUB_WORKSPACE/bin/aegis" ./cmd/aegis

      # This fallback is used only by the pull request that first introduces
      # the GitHub publisher. Review analysis still runs with the base binary,
      # and reasoning secrets stay disabled until the hardened reviewer
      # has landed on the base branch.
      - name: Select trusted publisher
        id: toolchain
        shell: bash
        run: |
          if "$GITHUB_WORKSPACE/bin/aegis" github --help >/dev/null 2>&1; then
            echo "publisher=$GITHUB_WORKSPACE/bin/aegis" >> "$GITHUB_OUTPUT"
            echo "secure_reasoning=true" >> "$GITHUB_OUTPUT"
            if "$GITHUB_WORKSPACE/bin/aegis" github --help 2>&1 | grep -q -- '--fail-on-needs-review'; then
              echo "needs_review_gate=true" >> "$GITHUB_OUTPUT"
            else
              echo "needs_review_gate=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Aegis compatibility mode::The trusted base publisher predates Needs Review gating. The new gate activates after this version lands on the base branch."
            fi
          else
            echo "::notice title=Aegis bootstrap mode::The base branch predates the GitHub publisher. This run is static-only and uses the proposed publisher solely to render existing JSON evidence."
            (
              cd target
              go build -trimpath -o "$GITHUB_WORKSPACE/bin/aegis-publisher" ./cmd/aegis
            )
            echo "publisher=$GITHUB_WORKSPACE/bin/aegis-publisher" >> "$GITHUB_OUTPUT"
            echo "secure_reasoning=false" >> "$GITHUB_OUTPUT"
            echo "needs_review_gate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Review pull-request changes
        id: review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          SECURE_REASONING: ${{ steps.toolchain.outputs.secure_reasoning }}
          # Never expose a secret to the bootstrap reviewer or a fork. The
          # trusted base binary must first prove that it supports child-process
          # credential isolation.
          DEEPSEEK_API_KEY: ${{ steps.toolchain.outputs.secure_reasoning == 'true' && github.event.pull_request.head.repo.full_name == github.repository && secrets.DEEPSEEK_API_KEY || '' }}
        shell: bash
        run: |
          set -u
          agent_args=(--agent-provider none)
          reasoning_enabled=false
          if [[ "$SECURE_REASONING" == "true" && "$SAME_REPOSITORY" == "true" && -n "${DEEPSEEK_API_KEY:-}" ]]; then
            agent_args=(--agent-provider deepseek)
            reasoning_enabled=true
            echo "::notice title=Aegis review mode::DeepSeek reasoning and deterministic verification are enabled."
          elif [[ "$SAME_REPOSITORY" != "true" ]]; then
            echo "::notice title=Aegis review mode::Fork pull request: running deterministic static review without repository secrets."
          else
            echo "::notice title=Aegis review mode::DEEPSEEK_API_KEY is not configured: running deterministic static review."
          fi

          set +e
          "$GITHUB_WORKSPACE/bin/aegis" review \
            --repo "$GITHUB_WORKSPACE/target" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --analyzers all \
            --format json \
            --output "$GITHUB_WORKSPACE/artifacts/review.json" \
            "${agent_args[@]}"
          review_exit=$?
          set -e

          echo "exit_code=$review_exit" >> "$GITHUB_OUTPUT"
          echo "reasoning_enabled=$reasoning_enabled" >> "$GITHUB_OUTPUT"
          if [[ "$review_exit" -ne 0 ]]; then
            echo "::warning title=Aegis review incomplete::The review engine returned exit code $review_exit; the publisher will preserve diagnostics and fail the merge gate."
          fi

      - name: Publish summary, annotations, and merge gate
        id: publish
        shell: bash
        run: |
          summary_path="$GITHUB_WORKSPACE/artifacts/review-summary.md"
          report_path="$GITHUB_WORKSPACE/artifacts/review.json"
          needs_review_args=()
          fail_on_incomplete=true
          if [[ "${{ steps.toolchain.outputs.needs_review_gate }}" == "true" ]]; then
            needs_review_args=(--fail-on-needs-review "$AEGIS_FAIL_ON_NEEDS_REVIEW")
          elif jq -e '
            .analysis.status == "complete" and
            .context.status == "complete" and
            .agent.status == "partial" and
            .verification.status == "partial" and
            ((.verification.warnings // []) | length > 0) and
            ((.verification.warnings // []) | all(. == "reasoning agent was partial"))
          ' "$report_path" >/dev/null; then
            # v0.6 copied an optional Agent coverage warning into the Verifier
            # status. Waive only that exact legacy cascade while keeping real
            # analyzer/context/verifier incompleteness fail-closed.
            fail_on_incomplete=false
            echo "::notice title=Aegis compatibility mode::Optional Reasoning Agent degradation is visible but does not override the deterministic P0/P1 merge gate."
          fi
          set +e
          "${{ steps.toolchain.outputs.publisher }}" github \
            --report "$report_path" \
            --html-output "$GITHUB_WORKSPACE/artifacts/review.html" \
            --summary "$summary_path" \
            --artifact-name "$AEGIS_ARTIFACT_NAME" \
            --fail-on "$AEGIS_FAIL_ON" \
            --fail-on-incomplete="$fail_on_incomplete" \
            --max-annotations 50 \
            "${needs_review_args[@]}"
          publish_exit=$?
          set -e

          if [[ ! -s "$summary_path" ]]; then
            printf '# 🛡️ Aegis Code Review\n\n> ❌ **Review publishing failed.** Open the workflow run for diagnostics.\n' > "$summary_path"
          fi
          cat "$summary_path" >> "$GITHUB_STEP_SUMMARY"
          exit "$publish_exit"

      - name: Upload complete Aegis evidence report
        id: upload-report
        if: always() && hashFiles('artifacts/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.AEGIS_ARTIFACT_NAME }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Publish pull-request review feedback
        if: >-
          ${{
            always() &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]' &&
            steps.upload-report.outcome == 'success'
          }}
        uses: actions/github-script@v9
        env:
          AEGIS_SUMMARY_PATH: ${{ github.workspace }}/artifacts/review-summary.md
          AEGIS_ARTIFACT_URL: ${{ steps.upload-report.outputs.artifact-url }}
          AEGIS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AEGIS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 3
          script: |
            const fs = require('fs');
            const marker = '<!-- aegis-code-agent-review -->';
            const summary = fs.readFileSync(process.env.AEGIS_SUMMARY_PATH, 'utf8').trim();
            const artifactURL = process.env.AEGIS_ARTIFACT_URL;
            const runURL = process.env.AEGIS_RUN_URL;
            const headSHA = process.env.AEGIS_HEAD_SHA.slice(0, 12);
            const body = [
              marker,
              summary,
              '',
              '---',
              '',
              '[⬇️ Download the complete HTML evidence report](' + artifactURL + ') · [View workflow run](' + runURL + ')',
              '',
              '_Updated for `' + headSHA + '`. Aegis refreshes this comment after every review run._',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
