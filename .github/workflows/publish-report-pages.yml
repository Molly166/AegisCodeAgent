name: Publish public HTML report (opt-in)

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: 'Completed Aegis review run ID in this public repository'
        required: true
        type: string
      pr-number:
        description: 'PR number; the report must match its current Base and Head'
        required: true
        type: string
      confirm-public:
        description: 'I reviewed the evidence and approve publishing it publicly. This replaces the current Pages site.'
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: aegis-public-report-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ inputs.confirm-public && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      head: ${{ steps.source.outputs.head }}
    steps:
      - name: Verify public repository and exact Aegis run provenance
        id: source
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          AEGIS_SOURCE_RUN: ${{ inputs.run-id }}
          AEGIS_PR_NUMBER: ${{ inputs.pr-number }}
        with:
          script: |
            for (const value of [process.env.AEGIS_SOURCE_RUN, process.env.AEGIS_PR_NUMBER]) {
              if (!/^[1-9][0-9]{0,14}$/.test(value)) throw new Error('Expected a numeric run/PR ID');
            }
            const { data: repo } = await github.rest.repos.get(context.repo);
            if (repo.private || repo.visibility !== 'public') throw new Error('Public report hosting is disabled for private/internal repositories');
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(process.env.AEGIS_SOURCE_RUN) });
            if (run.event !== 'pull_request' || run.status !== 'completed' ||
                run.path.split('@')[0] !== '.github/workflows/aegis-review.yml' ||
                run.repository.full_name !== repo.full_name) throw new Error('Expected a completed Aegis PR review in this repository');
            const number = Number(process.env.AEGIS_PR_NUMBER);
            if (!run.pull_requests.some(pr => pr.number === number)) throw new Error('Run does not belong to the selected PR');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...context.repo, run_id: run.id, per_page: 100 });
            const report = artifacts.filter(a => a.name === 'aegis-review-report-' + run.run_attempt && !a.expired);
            if (report.length !== 1 || report[0].size_in_bytes > 20 * 1024 * 1024) throw new Error('Missing, ambiguous, expired or oversized report artifact');
            core.setOutput('artifact-id', report[0].id);
            core.setOutput('base', pr.base.sha);
            core.setOutput('head', pr.head.sha);

      - name: Check out reviewed publisher source from default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: reviewer
          persist-credentials: false

      - name: Download only the selected artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ steps.source.outputs.artifact-id }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: evidence
          merge-multiple: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Regenerate safe HTML from validated JSON (never deploy uploaded HTML)
        env:
          AEGIS_BASE: ${{ steps.source.outputs.base }}
          AEGIS_HEAD: ${{ steps.source.outputs.head }}
        run: |
          mkdir -p bin
          (cd reviewer && go build -trimpath -o "$GITHUB_WORKSPACE/bin/aegis" ./cmd/aegis)
          node reviewer/scripts/host-report.cjs

      - name: Upload the single regenerated report for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved public report
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Show the HTTPS report address
        env:
          AEGIS_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          AEGIS_HEAD: ${{ needs.prepare.outputs.head }}
        run: |
          printf '[Open the public HTML report](%s) — commit `%s`. This opt-in Pages site contains only the latest manually published report.\n' "$AEGIS_PAGE_URL" "$AEGIS_HEAD" >> "$GITHUB_STEP_SUMMARY"
